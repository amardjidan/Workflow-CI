name: CI/CD MLflow with Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow scikit-learn pandas

      - name: Run MLflow Project
        id: mlflow_run
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: MLProject/mlruns/
          retention-days: 30

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          cd MLProject
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mlflow-model:latest .

      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mlflow-model:latest

      - name: Save Docker Hub URL
        run: |
          echo "https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/mlflow-model" > MLProject/tautan_docker_hub.txt

      - name: Upload Docker Hub URL
        uses: actions/upload-artifact@v4
        with:
          name: docker-hub-link
          path: MLProject/tautan_docker_hub.txt